# Calls Bloom's notify-scheduled Edge Function every hour.
# Required GitHub repo secret: CRON_SECRET (same value as Supabase secret CRON_SECRET)

name: Bloom scheduled notifications

on:
  schedule:
    - cron: "5 * * * *" # every hour at :05
  workflow_dispatch: # allow manual run from GitHub Actions UI

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger notify-scheduled
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing GitHub secret CRON_SECRET. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          curl -sS -f -X POST \
            "https://gixndvzewaizeqqluezu.supabase.co/functions/v1/notify-scheduled" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json"
